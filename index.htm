<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Sadiqa ❤️</title>

<style>
body {
  margin: 0;
  background: #0b141a;
  font-family: Arial, sans-serif;
}

/* PASSWORD SCREEN */
#lockScreen {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: #0b141a;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
}

#lockScreen input {
  padding: 12px;
  width: 250px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  font-size: 16px;
}

#lockScreen button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #25d366;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.error {
  color: red;
  margin-top: 10px;
}

/* CHAT UI */
.chat-container {
  max-width: 400px;
  margin: auto;
  height: 100vh;
  display: none;
  flex-direction: column;
}

.header {
  background: #075e54;
  color: white;
  padding: 15px;
  font-size: 18px;
}

.chat-box {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  background: #ece5dd;
}

.message {
  max-width: 70%;
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  font-size: 14px;
  position: relative;
}

.sent {
  background: #dcf8c6;
  margin-left: auto;
}

.received {
  background: white;
  margin-right: auto;
}

.typing {
  font-style: italic;
  font-size: 12px;
  margin-left: 10px;
  color: gray;
}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="lockScreen">
  <h2>Enter Password ❤️</h2>

  <input type="password" id="password" placeholder="Enter password">

  <button onclick="checkPassword()">Unlock</button>

  <div class="error" id="error"></div>
</div>

<!-- CHAT -->
<div class="chat-container" id="chatContainer">
  <div class="header">Sadiqa ❤️</div>

  <div class="chat-box" id="chat"></div>
  <div class="typing" id="typing"></div>
</div>

<audio id="bgm" loop>
  <source src="TumHiHo.mp3" type="audio/mpeg">
</audio>

<script>

function checkPassword() {

  let pass = document.getElementById("password").value;

  if(pass === "8143313638") {

    document.getElementById("lockScreen").style.display = "none";

    document.getElementById("chatContainer").style.display = "flex";

    document.getElementById("bgm").play();

    showMessage();

  } else {

    document.getElementById("error").innerHTML = "Wrong Password ❌";
  }
}

let chat = document.getElementById("chat");
let typing = document.getElementById("typing");

let messages = [
  { text: "Hey Sadiqa… ❤️", type: "sent" },
  { text: "I was thinking about us today…", type: "sent" },
  { text: "Every time I talk to you, my day gets a little better...❤️", type: "sent" },
  { text: "i missing u", type: "sent" },
  { text: "you are my favorite person ❤️", type: "sent" },
  { text: "I don’t say this everyday…", type: "sent" },
  { text: "I really love you so much ❤️", type: "sent" },
  { text: "And I always love u💫", type: "sent" }
];

let i = 0;

function showMessage() {

  if (i < messages.length) {

    typing.innerHTML = "typing...";

    setTimeout(() => {

      typing.innerHTML = "";

      let msg = document.createElement("div");

      msg.className = "message " + messages[i].type;

      msg.innerHTML = messages[i].text;

      chat.appendChild(msg);

      chat.scrollTop = chat.scrollHeight;

      i++;

      showMessage();

    }, 1500);
  }
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fake WhatsApp Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <img src="https://i.pravatar.cc/40" class="profile">

    <div>
      <h3>Rahul</h3>
      <p>online</p>
    </div>

  </div>

  <!-- CHAT AREA -->

  <div class="chat-box" id="chatBox">

    <div class="message received">
      Hello 😄
      <span>10:30 PM</span>
    </div>

    <div class="message sent">
      Hi bro!
      <span>10:31 PM</span>
    </div>

  </div>

  <!-- INPUT -->

  <div class="input-area">

    <input type="text" id="messageInput"
    placeholder="Type a message">

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
